name: Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-apk-audit-0152-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'
      - name: Reuse preview debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nikole-preview-debug-signing-v1
      - name: Run shop regression tests
        run: gradle --no-daemon :app:testDebugUnitTest -Ppreview
      # Testers on phones need the separate free-shop APK first.
      - name: Assemble independent preview APK
        run: gradle --no-daemon :app:assembleDebug -Ppreview
      - name: Verify preview package and archive
        run: |
          mkdir -p device-audit
          unzip -t app/build/outputs/apk/debug/app-debug.apk > device-audit/apk-zip.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > device-audit/apk-manifest.txt
          grep -q "name='com.nikolegame.preview'" device-audit/apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > device-audit/apk-signature.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > device-audit/apk-sha256.txt
      - name: Publish independent preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Domik-Nikole-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Assemble regular debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Domik-Nikole-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Android device tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Ppreview
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android smoke tests and collect frames
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p device-audit
            adb shell am instrument -w com.nikolegame.preview.test/androidx.test.runner.AndroidJUnitRunner | tee device-audit/instrumentation.txt
            adb pull /sdcard/Android/data/com.nikolegame.preview/files/audit device-audit
            adb logcat -d -b crash > device-audit/crashes.txt
            grep -q 'OK (1 test)' device-audit/instrumentation.txt
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Domik-Nikole-audit-evidence
          path: |
            device-audit
            app/build/reports/tests
            app/build/test-results
