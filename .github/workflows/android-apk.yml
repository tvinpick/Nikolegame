name: Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-apk-pet-transition-0151-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'
      - name: Run shop regression tests
        run: gradle --no-daemon :app:testDebugUnitTest -Ppreview
      # Testers on phones need the separate free-shop APK first.
      - name: Assemble independent preview APK
        run: gradle --no-daemon :app:assembleDebug -Ppreview
      - name: Publish independent preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Domik-Nikole-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Assemble regular debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Domik-Nikole-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
